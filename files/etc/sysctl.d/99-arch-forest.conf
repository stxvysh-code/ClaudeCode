# arch-forest: оптимизации
# zram: активнее использовать сжатую память, меньше лагов при нехватке ОЗУ
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
# Игры (как в SteamOS): некоторым играм нужно много отображений памяти
vm.max_map_count = 2147483642
# Сеть: современный алгоритм BBR — быстрее загрузки и стабильнее пинг
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
